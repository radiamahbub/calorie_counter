{% extends 'base.html' %}


{% block title %}
    {{title}}
{% endblock title %}
    

{% block content %}

    <h1 class="m-5 text-center">Profile Information</h1>

    <p>Username: {{request.user.username}}</p>
    <p>Name: {{request.user.user_profile.name}}</p>
    <p>BMR: {{request.user.user_profile.bmr}} kcal</p>

    <a href="{% url 'profile_update' %}" class="btn btn-success">Update Profile</a>

{% endblock content %}
